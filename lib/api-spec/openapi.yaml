openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: students
    description: Student grade tracking operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /students:
    get:
      operationId: listStudents
      tags: [students]
      summary: List students
      responses:
        "200":
          description: All student records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Student"
    post:
      operationId: createStudent
      tags: [students]
      summary: Add a student record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "201":
          description: Student record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Invalid student data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /students/{id}:
    put:
      operationId: updateStudent
      tags: [students]
      summary: Update a student record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentInput"
      responses:
        "200":
          description: Student record updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Student"
        "400":
          description: Invalid student data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteStudent
      tags: [students]
      summary: Delete a student record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "204":
          description: Student deleted
        "404":
          description: Student not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /students/summary:
    get:
      operationId: getStudentSummary
      tags: [students]
      summary: Get grade summary
      responses:
        "200":
          description: Summary metrics for all students
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentSummary"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Student:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        marks:
          type: number
          format: double
        grade:
          type: string
        createdAt:
          type: string
      required: [id, name, marks, grade, createdAt]
    StudentInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        marks:
          type: number
          format: double
          minimum: 0
          maximum: 100
      required: [name, marks]
    StudentSummary:
      type: object
      properties:
        totalStudents:
          type: integer
        averageScore:
          type: number
          format: double
        highestScore:
          type: number
          format: double
        lowestScore:
          type: number
          format: double
        passingStudents:
          type: integer
        passRate:
          type: number
          format: double
      required:
        - totalStudents
        - averageScore
        - highestScore
        - lowestScore
        - passingStudents
        - passRate
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

