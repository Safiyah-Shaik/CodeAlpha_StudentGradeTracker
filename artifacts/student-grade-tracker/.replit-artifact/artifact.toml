kind = "web"
previewPath = "/"
title = "Student Grade Tracker"
description = "A beginner-friendly student grade tracker for adding marks, managing records, and viewing score summaries in one responsive web app."
version = "1.0.0"
id = "artifacts/student-grade-tracker"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25692

[services.development]
run = "PORT=8080 mvn -q -f ../../backend/pom.xml spring-boot:run > /tmp/student-grade-tracker-backend.log 2>&1 & pnpm --filter @workspace/student-grade-tracker run dev"

[services.production.build]
args = [ "pnpm", "--filter", "@workspace/student-grade-tracker", "run", "build" ]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = [ "java", "-jar", "backend/target/student-grade-tracker-1.0.0.jar" ]

[services.production.run.env]
PORT = "25692"
NODE_ENV = "production"

[services.production.health.startup]
path = "/"

[services.env]
PORT = "25692"
BASE_PATH = "/"